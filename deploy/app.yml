version: '3.8'

services:
  openresty:
    image: openresty/openresty:1.25-alpine
    container_name: app-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
    depends_on:
      fastapi:
        condition: service_started
    restart: unless-stopped

  fastapi:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: app-fastapi
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - app_network

  taskiq-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: app-taskiq-worker
    env_file:
      - .env
    volumes:
      - ../:/app
    depends_on:
      - rabbitmq
      - redis
      - postgres
    command: taskiq worker -m app.core.taskiq:broker
    restart: unless-stopped
    networks:
      - app_network

  taskiq-scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: app-taskiq-scheduler
    env_file:
      - .env
    volumes:
      - ../:/app
    depends_on:
      - rabbitmq
      - redis
      - postgres
    command: taskiq scheduler -m app.core.taskiq:scheduler
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge